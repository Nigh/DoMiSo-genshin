version: '3'

info:
  companyName: "Nigh"
  productName: "DoMiSo Universal"
  productIdentifier: "com.nigh.domiso-universal"
  description: "DoMiSo notation player with piano roll visualization"
  copyright: "(c) 2025, Nigh"
  comments: "DoMiSo Universal Music Player"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - signal
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:
